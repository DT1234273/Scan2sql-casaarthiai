<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Deep Royal Navy Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Subtle Ambient Core Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#6366F1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer Bezel Rim Gradient -->
    <linearGradient id="rimGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.65"/>
    </linearGradient>

    <!-- Chariot Wheel / 'C' Cyan-Indigo Gradient -->
    <linearGradient id="wheelGrad" x1="16" y1="24" x2="72" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <!-- Sovereign Gold 'A' & Hub Gradient -->
    <linearGradient id="goldGrad" x1="48" y1="22" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="35%" stop-color="#FBBF24"/>
      <stop offset="75%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Rising Saarthi Swoosh Gradient -->
    <linearGradient id="swooshGrad" x1="26" y1="88" x2="102" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>

  <!-- Squircle Container -->
  <rect x="3" y="3" width="114" height="114" rx="28" fill="url(#bgGrad)"/>
  <rect x="3" y="3" width="114" height="114" rx="28" fill="url(#ambientGlow)"/>
  <rect x="3" y="3" width="114" height="114" rx="28" stroke="url(#rimGrad)" stroke-width="2.5"/>

  <!-- Subtle Inner Precision Ring -->
  <rect x="9" y="9" width="102" height="102" rx="22" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>

  <!-- SAARTHI CHARIOT WHEEL (Forms the letter 'C') -->
  <!-- Inner Spokes -->
  <g stroke="url(#wheelGrad)" stroke-width="2.6" stroke-linecap="round" opacity="0.85">
    <line x1="46" y1="33" x2="46" y2="87"/>
    <line x1="19" y1="60" x2="65" y2="60"/>
    <line x1="27" y1="41" x2="61" y2="79"/>
    <line x1="27" y1="79" x2="61" y2="41"/>
  </g>

  <!-- Inner Wheel Ring -->
  <circle cx="46" cy="60" r="14" stroke="url(#wheelGrad)" stroke-width="2.5" stroke-dasharray="62 26" transform="rotate(-35 46 60)"/>

  <!-- Outer Bold 'C' Chariot Rim -->
  <path d="M 62 34.5 A 30 30 0 1 0 62 85.5" stroke="url(#wheelGrad)" stroke-width="8.5" stroke-linecap="round"/>

  <!-- Wheel Rim Studs (Saarthi Heritage Detail) -->
  <circle cx="22" cy="43" r="2" fill="#BAE6FD"/>
  <circle cx="16" cy="60" r="2" fill="#BAE6FD"/>
  <circle cx="22" cy="77" r="2" fill="#BAE6FD"/>
  <circle cx="38" cy="89" r="2" fill="#BAE6FD"/>
  <circle cx="38" cy="31" r="2" fill="#BAE6FD"/>

  <!-- Glowing Golden Chariot Hub -->
  <circle cx="46" cy="60" r="6.5" fill="url(#goldGrad)"/>
  <circle cx="46" cy="60" r="2.5" fill="#FFFBEB"/>

  <!-- HIGHLIGHTED 'A' MONOGRAM (Sovereign Gold) -->
  <path d="M 73 25 L 97 90 H 86.5 L 81.5 75.5 H 64.5 L 59.5 90 H 49 L 73 25 Z M 73 43.5 L 67.2 66 H 78.8 L 73 43.5 Z" fill="url(#goldGrad)"/>

  <!-- Dynamic Rising Trajectory / Verification Swoosh across C & A -->
  <path d="M 34 86 C 48 82, 62 72, 76 55 C 84 45, 91 36, 99 28" stroke="#0B132B" stroke-width="7" stroke-linecap="round"/>
  <path d="M 34 86 C 48 82, 62 72, 76 55 C 84 45, 91 36, 99 28" stroke="url(#swooshGrad)" stroke-width="4.2" stroke-linecap="round"/>
  <!-- Arrowhead Spark at Tip of Swoosh -->
  <path d="M 91 27 H 100 V 36" stroke="#FDE68A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- AI OCR DIGITAL DATA STREAM BARS (Right of A) -->
  <rect x="85" y="39" width="17" height="3.6" rx="1.8" fill="#38BDF8"/>
  <rect x="89" y="47" width="15" height="3.6" rx="1.8" fill="#38BDF8" fill-opacity="0.85"/>
  <rect x="92" y="55" width="12" height="3.6" rx="1.8" fill="#FBBF24"/>
  <rect x="95" y="63" width="10" height="3.6" rx="1.8" fill="#38BDF8" fill-opacity="0.7"/>
</svg>
